name: "Automatically tag new version"

# Disabled until the first real release: it needs the AUTOTAG_TOKEN secret.
# To re-enable, restore the trigger below and configure the secret.
#
# on:
#   push:
#     branches:
#       - "main"
#       - "**/bugfixes"
#     paths:
#       - "setup.php"
on:
  workflow_dispatch:

jobs:
  auto-tag-new-version:
    name: "Automatically tag new version"
    uses: "glpi-project/plugin-release-workflows/.github/workflows/auto-tag-new-version.yml@v1"
    secrets:
      github-token: "${{ secrets.AUTOTAG_TOKEN }}"
