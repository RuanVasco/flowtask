name: flowtask_dev

services:
  glpi:
    image: "glpi/glpi:12.0.2"
    restart: "no"
    volumes:
      # Named volume for config, files and marketplace (avoids permission issues on the host)
      - glpi_data:/var/glpi
      # Plugin source, live-mounted
      - ./:/var/www/glpi/plugins/flowtask
    environment:
      GLPI_DB_HOST: db
      GLPI_DB_PORT: 3306
      GLPI_DB_NAME: glpi
      GLPI_DB_USER: glpi
      GLPI_DB_PASSWORD: glpi
      GLPI_INSTALL_MODE: DOCKER
    ports:
      - "8080:80"
    depends_on:
      - db

  db:
    image: "mariadb:11.4"
    restart: "no"
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: glpi
      MARIADB_USER: glpi
      MARIADB_PASSWORD: glpi
    volumes:
      - db_data:/var/lib/mysql

volumes:
  glpi_data:
  db_data:
